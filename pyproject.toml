[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coala"
version = "0.1.0"
description = "COALA models, datasets, and training utilities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "pytorch-lightning",
    "seaborn",
    "torch",
    "torchvision",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["coala*"]
