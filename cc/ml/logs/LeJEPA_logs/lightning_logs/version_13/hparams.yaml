decoder_densify_mode: random
denoise: true
lr: 0.001
mask_ratio: 0.6
masked_loss_weight: 3.0
masking_strategy: multi-block
multi_block_aspect_ratio_max: 1.5
multi_block_aspect_ratio_min: 0.5
multi_block_scale_max: 0.6
multi_block_scale_min: 0.1
multi_block_square_aspect_ratio: 1.0
noise_level: 0.75
norm_type: rmsnorm
num_filters: 32
num_input_channels: 1
patch_size: 4
sigreg_loss_weight: 0.1
sigreg_max_samples: 1024
upconv_method: upsample+conv
use_skip: false
